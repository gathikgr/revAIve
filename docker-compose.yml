version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: revaive-postgres
    restart: always
    environment:
      POSTGRES_USER: revaive_user
      POSTGRES_PASSWORD: revaive_password
      POSTGRES_DB: revaive_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revaive_user -d revaive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revaive-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: revaive-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://revaive_user:revaive_password@postgres:5432/revaive_db
      REDIS_URL: redis://redis:6379/0
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_12345
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
